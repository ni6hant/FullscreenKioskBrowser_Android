# Suppress known, accepted warnings for this build configuration.
# compileSdk 35 targets the connected test device (Android 16 / API 36); AGP 8.5.0 was
# tested up to compileSdk 34, but 35 compiles and runs fine.
android.suppressUnsupportedCompileSdk=35
# JDK 21 deprecates Java 8 source/target; we keep 8 for broad minSdk compatibility.
android.javaCompile.suppressSourceTargetDeprecationWarning=true
# Disable the Gradle daemon to avoid lingering file locks on Windows that break incremental builds.
org.gradle.daemon=false
