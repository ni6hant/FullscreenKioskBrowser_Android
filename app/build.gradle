plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Load keystore credentials from a gitignored env file (keystore.properties).
// This file is NOT committed; see keystore.properties.example for the template.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = 'com.simplekioskbrowser'
    compileSdk = 35

    defaultConfig {
        applicationId = 'com.ni6hant.fullscreen_kiosk_browser'
        minSdk = 24
        targetSdk = 35
        versionCode = 2
        versionName = '1.1'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    // Intentionally no external implementation dependencies: this MVP uses only the
    // Android framework and Kotlin standard library. Keeping the dependency surface
    // minimal reduces build risk and supply-chain exposure.
    testImplementation 'junit:junit:4.13.2'
}
